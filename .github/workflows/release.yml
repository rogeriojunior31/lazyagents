name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # A tag only becomes a release if the suite passes on it.
      - name: check
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -o /dev/null scripts/preview.go
          bash -n scripts/*.sh

      - name: build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="lazyagents"
            [ "$os" = "windows" ] && name="lazyagents.exe"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "dist/$name" .
            if [ "$os" = "windows" ]; then
              (cd dist && zip -jq "lazyagents_${version}_${os}_${arch}.zip" "$name" ../LICENSE ../README.md ../internal/tui/theme/LICENSE-SP-Night ../internal/tui/theme/LICENSES-themes.md && rm "$name")
            else
              (cd dist && tar -czf "lazyagents_${version}_${os}_${arch}.tar.gz" "$name" -C .. LICENSE README.md internal/tui/theme/LICENSE-SP-Night internal/tui/theme/LICENSES-themes.md && rm "$name")
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
