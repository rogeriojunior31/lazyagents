name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Same sequence as CLAUDE.md, in the same order.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "files not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: scripts
        run: bash -n scripts/*.sh
      - name: build
        run: go build ./...
      # English is the project language (CLAUDE.md).
      - name: english
        run: scripts/check-english.sh

      # The preview script has the ignore tag: ./... skips it, so it would
      # break unnoticed.
      - name: build preview
        run: go build -o /dev/null scripts/preview.go

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build every published target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "→ $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
