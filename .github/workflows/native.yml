name: Native

# The suite on macOS and Windows, next to Linux in ci.yml. Plugin tests run a
# Go-built fake plugin, so they cover every OS the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
