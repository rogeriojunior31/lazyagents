name: Native

# The suite on macOS and Windows, next to Linux in ci.yml. On Windows the tests
# whose fake plugins are shell scripts skip; .exe discovery has its own test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
